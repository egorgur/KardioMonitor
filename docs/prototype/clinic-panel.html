<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KardioMonitor — прототип панели клиники</title>
<!--
  Прототип панели клиники по docs/requirements.md (ТР-01…ТР-11).
  Две страницы: главная (ТР-06, ТР-08, ТР-07) и страница пациента (ТР-01…ТР-05, ТР-07…ТР-09).
  Все данные вымышленные и генерируются в браузере. Один файл, без зависимостей.
-->
<style>
:root {
  color-scheme: light;
  --bg: #f6f5f2;
  --surface: #ffffff;
  --surface-2: #faf9f7;
  --surface-hover: #f0eee9;
  --border: #e4e1da;
  --text: #1d1c1a;
  --text-2: #4a4843;
  --text-muted: #6d6a63;
  --grid: #ebe8e1;
  --accent: #d63c4f;
  --accent-soft: #fbe9eb;
  --steps: #3d6fb6;
  --track: #ece9e3;
  /* Категории пульса относительно зоны пациента (проверено validate_palette.js, light) */
  --hr-below: #3f74d1;
  --hr-zone: #1a9460;
  --hr-above: #b98400;
  --hr-high: #c8305a;
  /* Статусы */
  --ok: #1a9460;
  --ok-soft: #e4f3eb;
  --warn: #9a6a00;
  --warn-soft: #faf0d9;
  --bad: #c8305a;
  --bad-soft: #fbe8ee;
  --nodata: #d9d5cc;
  --sleep: #c9d3e6;
  --radius: 14px;
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #141413;
    --surface: #1e1d1b;
    --surface-2: #232220;
    --surface-hover: #282724;
    --border: #2f2d2a;
    --text: #efede8;
    --text-2: #cfccc5;
    --text-muted: #9c988f;
    --grid: #2a2926;
    --accent: #f0687a;
    --accent-soft: #3a2025;
    --steps: #79a3e0;
    --track: #2c2b28;
    --hr-below: #5b8ee8;
    --hr-zone: #2fae75;
    --hr-above: #c2821a;
    --hr-high: #e4557e;
    --ok: #4cc98d;
    --ok-soft: #1c3127;
    --warn: #e0a640;
    --warn-soft: #362b17;
    --bad: #f0708f;
    --bad-soft: #3a1f27;
    --nodata: #3a3834;
    --sleep: #2c3446;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -0.01em; }
h1 { font-size: 26px; }
h2 { font-size: 17px; }
h3 { font-size: 14px; }
.muted { color: var(--text-muted); }
.small { font-size: 13px; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- Шапка ---------- */
.proto-banner {
  background: repeating-linear-gradient(135deg, var(--warn-soft) 0 12px, transparent 12px 24px), var(--surface-2);
  border-bottom: 1px solid var(--border);
  font-size: 12.5px; color: var(--text-2);
  padding: 6px 24px; text-align: center;
}
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1280px; margin: 0 auto; padding: 0 24px; height: 58px;
  display: flex; align-items: center; gap: 28px;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; text-decoration: none; font-size: 16px; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 9px; background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center;
}
.nav { display: flex; gap: 4px; }
.nav a {
  text-decoration: none; padding: 7px 12px; border-radius: 9px; color: var(--text-2); font-size: 14px;
  display: inline-flex; gap: 8px; align-items: center;
}
.nav a:hover { background: var(--surface-hover); }
.nav a.active { background: var(--surface-hover); color: var(--text); font-weight: 600; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 16px; font-size: 14px; }
.clock { color: var(--text-muted); font-size: 13px; }
.doctor { display: flex; align-items: center; gap: 10px; }
.avatar {
  width: 32px; height: 32px; border-radius: 50%; background: var(--surface-hover); border: 1px solid var(--border);
  display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--text-2);
}

/* ---------- Общие элементы ---------- */
.page { max-width: 1280px; margin: 0 auto; padding: 28px 24px 56px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.card-pad { padding: 20px 22px; }
.card-head { display: flex; align-items: center; gap: 12px; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--border); background: var(--surface); border-radius: 10px;
  padding: 8px 14px; cursor: pointer; font-size: 14px; font-weight: 550;
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover { background: var(--surface-hover); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn.primary:hover { opacity: .9; }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-hover); }
.btn.sim { border-style: dashed; color: var(--text-muted); font-weight: 500; }
.btn:disabled { opacity: .45; cursor: default; }
.chip {
  border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
  padding: 5px 12px; font-size: 13px; cursor: pointer; color: var(--text-2);
  display: inline-flex; align-items: center; gap: 6px;
}
.chip:hover { background: var(--surface-hover); }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip .n { font-variant-numeric: tabular-nums; opacity: .75; }
.tag {
  display: inline-flex; align-items: center; gap: 5px; border-radius: 6px; padding: 1px 8px;
  font-size: 12.5px; font-weight: 600; white-space: nowrap;
}
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.neutral { background: var(--surface-hover); color: var(--text-muted); }
.input, select.input {
  border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-size: 14px;
  outline: none;
}
.input:focus { border-color: var(--text-muted); box-shadow: 0 0 0 3px color-mix(in srgb, var(--text-muted) 18%, transparent); }
.input.invalid { border-color: var(--bad); }
.meter { height: 6px; border-radius: 99px; background: var(--track); overflow: hidden; position: relative; }
.meter > span { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--text-muted); }
.meter.ok > span { background: var(--ok); }
.meter.prog > span { background: var(--text); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.ok { background: var(--ok); }
.dot.warn { background: var(--warn); }
.dot.bad { background: var(--bad); }
.dot.none { background: var(--nodata); }
.disclaimer {
  font-size: 12.5px; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 12px; margin-top: 14px;
  display: flex; gap: 8px;
}
.notice {
  font-size: 13px; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 10px; padding: 9px 12px; display: flex; gap: 8px; align-items: flex-start;
}
.notice.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.notice.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.notice.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }

/* ---------- Главная ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.page-head p { margin: 4px 0 0; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.kpi { padding: 16px 18px; }
.kpi .v { font-size: 28px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .v small { font-size: 15px; color: var(--text-muted); font-weight: 500; }
.kpi .l { font-size: 13px; color: var(--text-muted); margin-top: 4px; display: flex; gap: 6px; align-items: center; }
.kpi.click { cursor: pointer; transition: border-color .15s; }
.kpi.click:hover { border-color: var(--text-muted); }

.main-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 16px 18px 12px; }
.search { position: relative; flex: 1 1 260px; }
.search input { width: 100%; padding-left: 36px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 18px 14px; }

.plist { border-top: 1px solid var(--border); }
.prow {
  display: grid; grid-template-columns: minmax(200px, 1.6fr) minmax(170px, 1.3fr) minmax(190px, 1.4fr) 128px 64px;
  gap: 18px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border);
  text-decoration: none; color: inherit;
}
.prow:last-child { border-bottom: 0; }
a.prow:hover { background: var(--surface-2); }
.prow.headrow { padding-top: 10px; padding-bottom: 10px; font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.pname { font-weight: 600; }
.pname mark { background: color-mix(in srgb, var(--hr-above) 28%, transparent); color: inherit; border-radius: 3px; }
.psub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.cell-prog .top { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 6px; }
.cell-prog .bot { font-size: 12.5px; color: var(--text-muted); margin-top: 6px; }
.mini { display: grid; grid-template-columns: 44px 1fr auto; gap: 8px; align-items: center; font-size: 12.5px; }
.mini + .mini { margin-top: 6px; }
.mini .k { color: var(--text-muted); }
.mini .val { font-variant-numeric: tabular-nums; text-align: right; min-width: 92px; color: var(--text-2); }
.lastdata { font-size: 13px; display: flex; gap: 7px; align-items: center; }
.badge {
  min-width: 26px; height: 24px; padding: 0 8px; border-radius: 99px; display: inline-grid; place-items: center;
  background: var(--bad-soft); color: var(--bad); font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums;
}
.empty { padding: 40px 18px; text-align: center; color: var(--text-muted); }

.feed { position: sticky; top: 78px; max-height: calc(100vh - 100px); display: flex; flex-direction: column; }
.feed-head { padding: 16px 18px 10px; }
.feed-list { overflow: auto; padding: 0 10px; flex: 1; }
.alert-item {
  padding: 12px 8px; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 26px 1fr; gap: 10px;
}
.alert-item:last-child { border-bottom: 0; }
.alert-item.seen { opacity: .6; }
.a-ico {
  width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; font-weight: 800;
}
.a-ico.bad { background: var(--bad-soft); color: var(--bad); }
.a-ico.warn { background: var(--warn-soft); color: var(--warn); }
.a-ico.ok { background: var(--ok-soft); color: var(--ok); }
.a-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.a-kind { font-weight: 650; }
.a-time { color: var(--text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.a-who { font-size: 13px; margin-top: 1px; }
.a-who a { color: var(--text-2); }
.a-text { font-size: 13px; color: var(--text-2); margin-top: 2px; font-variant-numeric: tabular-nums; }
.a-actions { margin-top: 6px; display: flex; gap: 8px; align-items: center; }
.feed-foot { padding: 0 18px 16px; }

/* ---------- Пациент ---------- */
.back { display: inline-flex; gap: 6px; align-items: center; text-decoration: none; color: var(--text-muted); font-size: 14px; margin-bottom: 14px; }
.back:hover { color: var(--text); }
.phead { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: start; margin-bottom: 20px; }
.phead h1 { margin-bottom: 8px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 14px; color: var(--text-2); }
.facts span b { color: var(--text-muted); font-weight: 500; margin-right: 4px; }
.diag { margin-top: 8px; font-size: 14px; }
.diag b { color: var(--text-muted); font-weight: 500; margin-right: 4px; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

.prog-top { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-bottom: 18px; }
.big { font-size: 24px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.big small { font-size: 15px; color: var(--text-muted); font-weight: 500; }
.lbl { font-size: 12.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; margin-bottom: 4px; }
.strip { display: grid; gap: 3px; }
.stage-band {
  font-size: 12px; color: var(--text-2); padding: 4px 8px; border-radius: 7px; background: var(--surface-2);
  border: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.stage-band.cur { border-color: var(--text-muted); }
.daycell {
  height: 30px; border-radius: 5px; border: 0; padding: 0; cursor: pointer; position: relative;
  background: var(--track); transition: transform .1s;
}
.daycell:hover { transform: translateY(-2px); }
.daycell.met { background: var(--ok); }
.daycell.missed { background: var(--hr-high); opacity: .85; }
.daycell.nodata { background: repeating-linear-gradient(135deg, var(--nodata) 0 3px, transparent 3px 6px); border: 1px solid var(--nodata); }
.daycell.today { background: var(--surface); border: 2px solid var(--text); }
.daycell.future { background: var(--track); cursor: default; opacity: .6; }
.daycell.future:hover { transform: none; }
.daycell.sel::after { content: ""; position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); border: 5px solid transparent; border-bottom-color: var(--text); }
.daycell .x { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; }
.strip-axis { display: grid; gap: 3px; font-size: 11px; color: var(--text-muted); margin-top: 10px; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); margin-top: 14px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }
.legend i.line { height: 3px; border-radius: 2px; vertical-align: 3px; width: 16px; }

.dayhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.daynav { display: flex; gap: 4px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 16px 0 18px; }
.tile { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.tile .sub { font-size: 12.5px; color: var(--text-muted); margin-top: 8px; line-height: 1.4; }
.tile .meter { margin-top: 10px; }
.chart-wrap { position: relative; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 6px 0 6px; flex-wrap: wrap; }
.axis text, .axis-label { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.tip {
  position: fixed; pointer-events: none; z-index: 50; background: var(--text); color: var(--bg);
  font-size: 12.5px; padding: 7px 10px; border-radius: 8px; line-height: 1.4; white-space: nowrap;
  opacity: 0; transition: opacity .1s; font-variant-numeric: tabular-nums;
}
.tip.show { opacity: 1; }
.tip b { font-weight: 650; }

.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; margin-top: 20px; }
.dist-row { display: grid; grid-template-columns: 64px 1fr 92px; gap: 10px; align-items: center; font-size: 13px; padding: 3px 0; }
.dist-row .bar { height: 16px; border-radius: 0 4px 4px 0; background: var(--hr-below); min-width: 2px; }
.dist-row.zone .bar { background: var(--hr-zone); }
.dist-row.above .bar { background: var(--hr-above); }
.dist-row.high .bar { background: var(--hr-high); }
.dist-row .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); }
.dist-row .num span { color: var(--text-muted); }
.dist-row .rl { font-variant-numeric: tabular-nums; color: var(--text-2); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; padding: 2px; background: var(--surface-2); }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 8px; font-size: 13px; cursor: pointer; color: var(--text-2); }
.seg button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / .08); }

.live-state { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.live-big { font-size: 46px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.live-big small { font-size: 16px; color: var(--text-muted); font-weight: 500; margin-left: 4px; }
.heartbeat { color: var(--accent); animation: beat 0.9s ease-in-out infinite; display: inline-block; }
@keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(1); } }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--text-muted); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .heartbeat, .spinner { animation: none; } }
.form-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.req-hist { margin-top: 14px; font-size: 13px; }
.req-hist div { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--border); color: var(--text-2); }

.stages { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.stages th { text-align: left; font-size: 12px; color: var(--text-muted); font-weight: 600; padding: 0 6px 6px 0; }
.stages td { padding: 4px 6px 4px 0; }
.stages input { width: 100%; padding: 6px 8px; border-radius: 8px; text-align: right; font-variant-numeric: tabular-nums; }
.range { display: flex; align-items: center; gap: 4px; }
.range span { color: var(--text-muted); }
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin-top: 8px; }
.field label { display: block; font-size: 12.5px; color: var(--text-muted); margin-bottom: 4px; }
.field .input { width: 100%; }
.field .hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.section-sep { border-top: 1px solid var(--border); margin: 18px 0 14px; }
.errors { margin-top: 12px; display: grid; gap: 6px; }

/* ---------- Модальное окно ---------- */
.modal-bg {
  position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 60; display: grid; place-items: center; padding: 20px;
  animation: fade .15s ease-out;
}
.modal { width: min(560px, 100%); max-height: calc(100vh - 40px); overflow: auto; padding: 22px 24px; animation: pop .18s cubic-bezier(.2,.9,.3,1.2); }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(.97) translateY(6px); } }
.modal .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 14px; }
.modal .full { grid-column: 1 / -1; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.qr { display: grid; grid-template-columns: 200px 1fr; gap: 20px; align-items: center; margin-top: 14px; }
.qr svg { width: 200px; height: 200px; background: #fff; padding: 10px; border-radius: 12px; border: 1px solid var(--border); }
.code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 18px; letter-spacing: .12em; font-weight: 600; }

@media (max-width: 1100px) {
  .main-grid { grid-template-columns: 1fr; }
  .feed { position: static; max-height: none; }
  .tiles { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 860px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .prow { grid-template-columns: 1fr 1fr; }
  .prow.headrow { display: none; }
  .grid-2, .prog-top, .phead { grid-template-columns: 1fr; }
  .head-actions { justify-content: flex-start; }
  .clock { display: none; }
}
</style>
</head>

/* =====================================================================
   Утилиты

function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const fmt = n => Math.round(n).toLocaleString("ru-RU");
const pad = n => String(n).padStart(2, "0");
const hm = m => `${pad(Math.floor(((m % 1440) + 1440) % 1440 / 60))}:${pad(((m % 60) + 60) % 60)}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = s => s.toLowerCase().replace(/ё/g, "е");
const fullName = p => [p.last, p.first, p.middle].filter(Boolean).join(" ");
const shortName = p => `${p.last} ${p.first[0]}.${p.middle ? " " + p.middle[0] + "." : ""}`;
function age(p) {
  const b = new Date(p.birth);
  let a = TODAY.getFullYear() - b.getFullYear();
  if (TODAY.getMonth() < b.getMonth() || (TODAY.getMonth() === b.getMonth() && TODAY.getDate() < b.getDate())) a--;
  return a;
}
function yearsWord(n) {
  const d = n % 10, dd = n % 100;
  if (d === 1 && dd !== 11) return "год";
  if (d >= 2 && d <= 4 && (dd < 12 || dd > 14)) return "года";
  return "лет";
}
function daysWord(n) {
  const d = n % 10, dd = n % 100;
  if (d === 1 && dd !== 11) return "дне";
  return "днях";
}
function dateOf(p, d) { const x = new Date(TODAY); x.setDate(x.getDate() - (p.dayIdx - d)); return x; }
const dShort = x => `${x.getDate()} ${MONTHS[x.getMonth()]}`;
const dNum = x => `${pad(x.getDate())}.${pad(x.getMonth() + 1)}.${x.getFullYear()}`;

  const off = p.dayIdx - d;
  return off === 0 ? "сегодня" : off === 1 ? "вчера" : dShort(dateOf(p, d));
}
function agoText(min) {
  if (min == null) return "данных ещё нет";
  if (min < 60) return `${min} мин назад`;
  if (min < 24 * 60) { const h = Math.floor(min / 60), m = min % 60; return m && h < 6 ? `${h} ч ${m} мин назад` : `${h} ч назад`; }
  return `${Math.floor(min / 1440)} дн назад`;
}
function agoStatus(min) { return min == null ? "none" : min <= 90 ? "ok" : min <= 360 ? "warn" : "bad"; }
const tzText = tz => `UTC${tz >= 0 ? "+" : "−"}${Math.abs(tz)}`;
const localNow = p => NOW_UTC_MIN + p.tz * 60;
const utcToLocal = (utc, tz) => { const [h, m] = utc.split(":").map(Number); return hm(h * 60 + m + tz * 60); };

function stageFor(p, d) {
  const dd = Math.min(Math.max(d, 1), p.total);
  return p.stages.find(s => dd >= s.from && dd <= s.to) || p.stages[p.stages.length - 1];

const programDone = p => p.dayIdx > p.total;

/* =====================================================================
   Поминутные данные дня (детерминированный генератор)
   Минута: { kind: sleep|off|charge|other, hr: число|null, steps }.
   Минуты, которые ещё не пришли с телефона (задержка синхронизации), — null.
   ===================================================================== */
const dayCache = new Map();
function profileOf(p, d) {
  if (d === p.dayIdx) return p.today;
  return p.planArr[d - 1] || "g";
}
function genDay(p, d) {
  const key = p.id + ":" + d;
  if (dayCache.has(key)) return dayCache.get(key);
  const prof = profileOf(p, d);
  const r = rng(p.id * 10007 + d * 131);
  const st = stageFor(p, d);
  const thr = p.settings.walk;
  // Последние пришедшие данные: «сейчас» минус задержка синхронизации.
  const nowAbs = p.dayIdx * 1440 + localNow(p);
  const cutoff = p.lag == null ? 0 : Math.max(0, Math.min(1440, nowAbs - p.lag - d * 1440));
  const mins = new Array(1440).fill(null);
  if (prof !== "n" && cutoff > 0) {
    const wake = 390 + Math.floor(r() * 45), bed = 1345 + Math.floor(r() * 60);
    const offS = 1110 + Math.floor(r() * 50), offE = offS + 20 + Math.floor(r() * 25);
    const chS = 1250 + Math.floor(r() * 30), chE = chS + 35 + Math.floor(r() * 20);
    for (let t = 0; t < 1440; t++) {
      let kind = "other", hr;
      if (t < wake || t >= bed) { kind = "sleep"; hr = 55 + r() * 7 + 3 * Math.sin(t / 50); }
      else hr = 71 + 7 * Math.sin(t / 95) + r() * 8;
      if (t >= offS && t < offE) { kind = "off"; hr = null; }
      if (t >= chS && t < chE) { kind = "charge"; hr = null; }
      if (hr != null && r() < p.miss) hr = null;
      mins[t] = { kind, hr: hr == null ? null : Math.round(hr), steps: 0, walk: false };
    }
    // Ходьба: блоки по 6–14 мин утром и вечером, пока не набрано нужное число тренировочных минут.
    const target = { g: st.min + 4 + r() * 12, m: st.min * (0.35 + r() * 0.3), s: st.min + 2 + r() * 10, l: r() * 4 }[prof];
    let training = 0, guard = 0;
    while (training < target && guard++ < 200) {
      const morning = r() < (p.morning ? 0.95 : 0.6);
      const len = 6 + Math.floor(r() * 9);
      const start = morning ? 480 + Math.floor(r() * 220) : 960 + Math.floor(r() * 170);
      let free = true;
      for (let t = start - 1; t <= start + len; t++) if (!mins[t] || mins[t].walk || mins[t].kind !== "other") { free = false; break; }
      if (!free) continue;
      const tilt = r();
      for (let t = start; t < start + len; t++) {
        const m = mins[t];
        m.walk = true;
        m.steps = 75 + Math.floor(r() * 40);
        let hr;
        if (tilt < 0.12) hr = st.hi + 2 + r() * 8;
        else if (tilt < 0.2) hr = st.lo - 9 + r() * 7;
        else hr = st.lo + 1 + r() * (st.hi - st.lo - 2);
        m.hr = r() < p.miss ? null : Math.round(hr);
        if (m.hr != null && m.hr >= st.lo && m.hr <= st.hi) training++;
      }
    }
    // Остальные шаги — мелкими порциями не выше порога ходьбы, чтобы не создавать лишних минут ходьбы.
    const stepsTarget = { g: st.steps * (1.03 + r() * 0.18), m: st.steps * (1.0 + r() * 0.12), s: st.steps * (0.6 + r() * 0.25), l: 380 + r() * 420 }[prof];
    let have = mins.reduce((a, m) => a + (m ? m.steps : 0), 0);
    const cap = Math.max(5, thr - 6);
    guard = 0;
    while (have < stepsTarget && guard++ < 20000) {
      const t = wake + Math.floor(r() * ((p.morning ? Math.min(bed, 870) : bed) - wake));
      const m = mins[t];
      if (!m || m.walk || m.kind !== "other" || m.steps >= cap) continue;
      const add = Math.min(cap - m.steps, 6 + Math.floor(r() * 30), Math.ceil(stepsTarget - have));
      m.steps += add; have += add;
    }
    // Эпизод высокого пульса (ТР-08 п.5): 135, 140, 138, перерыв 2 мин, 131.
    if (p.highDays.includes(d)) {
      const s = 600 + Math.floor(r() * 30);
      const peak = p.settings.high;
      [[0, peak + 5], [1, peak + 10], [2, peak + 8], [5, peak + 1]].forEach(([o, v]) => { mins[s + o].hr = v; mins[s + o].kind = "other"; });
      [3, 4].forEach(o => { mins[s + o].hr = 96 + o; });
    }
    for (let t = cutoff; t < 1440; t++) mins[t] = null;
  }
  const out = { d, st, mins, cutoff, prof };
  dayCache.set(key, out);
  return out;
}

/* ТР-02: оценка минуты */
function classify(m, st, thr) {
  if (!m) return "none";
  if (m.kind === "off") return "off";
  if (m.kind === "charge") return "charge";
  if (m.steps > thr) {
    if (m.hr == null) return "walk-nohr";
    if (m.hr > st.hi) return "walk-above";
    if (m.hr < st.lo) return "walk-below";
    return "training";
  }
  return m.kind === "sleep" ? "sleep" : "rest";
}
const CLASS_TEXT = {
  none: "данных нет", off: "браслет снят", charge: "зарядка", sleep: "сон", rest: "покой",
  training: "тренировочная минута", "walk-above": "ходьба выше зоны", "walk-below": "ходьба ниже зоны", "walk-nohr": "ходьба, пульс не измерен",
};

/* ТР-03: выполнение нормы за день */
function summarize(p, d) {
  const day = genDay(p, d);
  const st = day.st, thr = p.settings.walk;
  const s = { d, st, training: 0, steps: 0, received: 0, worn: 0, wornNoHr: 0, walk: 0, walkAbove: 0, walkBelow: 0, walkNoHr: 0 };
  for (const m of day.mins) {
    if (!m) continue;
    s.received++; s.steps += m.steps;
    const c = classify(m, st, thr);
    if (c !== "off" && c !== "charge") { s.worn++; if (m.hr == null) s.wornNoHr++; }
    if (c === "training") { s.training++; s.walk++; }
    if (c === "walk-above") { s.walkAbove++; s.walk++; }
    if (c === "walk-below") { s.walkBelow++; s.walk++; }
    if (c === "walk-nohr") { s.walkNoHr++; s.walk++; }
  }
  s.noData = s.received === 0;
  s.isToday = d === p.dayIdx;
  s.inProgram = d >= 1 && d <= p.total;
  s.minOk = s.training >= st.min;
  s.stepsOk = s.steps >= st.steps;
  s.met = !s.noData && s.minOk && s.stepsOk;
  s.noHrShare = s.worn ? s.wornNoHr / s.worn : 0;
  s.cutoff = day.cutoff;
  return s;
}

/* ТР-05: прогресс реабилитации */
function progress(p) {
  const completed = Math.min(p.dayIdx - 1, p.total);
  let met = 0;
  for (let d = 1; d <= completed; d++) if (p.sum[d].met) met++;
  return { day: Math.min(p.dayIdx, p.total), completed, met, done: programDone(p), stage: stageFor(p, p.dayIdx) };
}

/* ТР-08: оповещения, выведенные из данных */
const ALERT_KIND = {

  LowActivity: { label: "Почти не ходит", cls: "warn", ico: "↓" },
  DailyTargetMet: { label: "Норма дня выполнена", cls: "ok", ico: "✓" },

function hrEpisodes(mins, thr) {
  const eps = []; let cur = null;
  mins.forEach((m, t) => {
    if (!m || m.hr == null || m.hr <= thr) return;
    if (cur && t - cur.end <= 6) { cur.end = t; cur.max = Math.max(cur.max, m.hr); }
    else { cur = { start: t, end: t, max: m.hr }; eps.push(cur); }

  return eps;
}

function buildAlerts(p) {
  const out = [];

  const lastDaily = Math.min(p.total, p.dayIdx - (localNow(p) >= ah * 60 + am ? 0 : 1));
  for (let d = Math.max(1, p.dayIdx - 14); d <= lastDaily; d++) {
    const s = p.sum[d], st = s.st;
    const vals = s.noData ? "данных за день нет" : `${s.training} из ${st.min} мин, ${fmt(s.steps)} из ${fmt(st.steps)} шагов`;
    const when = { d, t: ah * 60 + am };
    out.push({ kind: s.met ? "DailyTargetMet" : "DailyTargetMissed", text: vals, ...when });
    if (!s.noData && s.steps < p.settings.low) out.push({ kind: "LowActivity", text: `${fmt(s.steps)} шагов за день при пороге ${fmt(p.settings.low)}`, ...when });
  }
  for (const d of p.highDays) {
    if (d > p.dayIdx) continue;
    for (const e of hrEpisodes(genDay(p, d).mins, p.settings.high)) {
      out.push({ kind: "HighHeartRate", d, t: e.end, text: `пульс до ${e.max} при пороге ${p.settings.high}, ${e.end - e.start + 1} мин (${hm(e.start)}–${hm(e.end)})` });
    }

    a.id = `${p.id}-${a.kind}-${a.d}-${a.t}`;

function prepare(p) {
  if (!p.planArr) {
    if (p.plan) p.planArr = p.plan.split("");
    else {
      const completed = Math.min(p.dayIdx - 1, p.total);
      const r = rng(p.id * 77);
      const arr = new Array(completed).fill("g");
      const idx = [...arr.keys()].sort(() => r() - 0.5);
      let k = 0;
      for (let i = 0; i < (p.nodata || 0); i++) arr[idx[k++]] = "n";
      while (k < completed - p.met) arr[idx[k++]] = r() < 0.5 ? "m" : "s";
      p.planArr = arr;
    }
  }
  p.sum = {};
  for (let d = 1; d <= p.dayIdx; d++) p.sum[d] = summarize(p, d);

  let left = x + 14, top = y - h - 12;
  if (left + w > innerWidth - 8) left = x - w - 14;
  if (top < 8) top = y + 16;
  tip.style.left = left + "px"; tip.style.top = top + "px";
}

function toast(text) {
  const el = document.createElement("div");

function filteredPatients() {
  const q = norm(listState.q.trim());
  const terms = q.split(/\s+/).filter(Boolean);
  const F = {
    all: () => true,
    alerts: p => unseenOf(p.id) > 0,
    behind: p => !programDone(p) && !p.sum[p.dayIdx].met,
    stale: p => agoStatus(p.lag) !== "ok",
    done: p => programDone(p),
  };
  const list = PATIENTS.filter(p => terms.every(t => p.searchKey.includes(t)));
  const counts = Object.fromEntries(Object.keys(F).map(k => [k, list.filter(F[k]).length]));
  const rows = list.filter(F[listState.filter]);
  const progShare = p => { const g = progress(p); return g.completed ? g.met / g.completed : 1; };
  const S = {
    alerts: (a, b) => unseenOf(b.id) - unseenOf(a.id) || a.searchKey.localeCompare(b.searchKey, "ru"),
    name: (a, b) => a.searchKey.localeCompare(b.searchKey, "ru"),
    stale: (a, b) => (b.lag ?? 1e9) - (a.lag ?? 1e9),
    progress: (a, b) => progShare(a) - progShare(b),
  };
  rows.sort(S[listState.sort]);
  return { rows, counts };
}

function highlight(text) {
  const terms = norm(listState.q.trim()).split(/\s+/).filter(Boolean);
  if (!terms.length) return esc(text);
  const n = norm(text);
  const marks = new Array(text.length).fill(false);
  for (const t of terms) { let i = n.indexOf(t); while (i >= 0) { for (let k = i; k < i + t.length; k++) marks[k] = true; i = n.indexOf(t, i + 1); } }
  let out = "", open = false;
  for (let i = 0; i < text.length; i++) {
    if (marks[i] && !open) { out += "<mark>"; open = true; }
    if (!marks[i] && open) { out += "</mark>"; open = false; }
    out += esc(text[i]);
  }
  return out + (open ? "</mark>" : "");
}

    else todayCell = `
      <div class="mini"><span class="k">Мин</span><div class="meter ${s.minOk ? "ok" : ""}"><span style="width:${Math.min(100, s.training / st.min * 100)}%"></span></div><span class="val">${s.training} из ${st.min}</span></div>
      <div class="mini"><span class="k">Шаги</span><div class="meter ${s.stepsOk ? "ok" : ""}"><span style="width:${Math.min(100, s.steps / st.steps * 100)}%"></span></div><span class="val">${fmt(s.steps)} из ${fmt(st.steps)}</span></div>`;

  }).join("");
  document.getElementById("plist").innerHTML = head + (body || `<div class="empty">Никого не нашли${listState.q ? ` по запросу «${esc(listState.q)}»` : ""}. Поиск — по любой части фамилии, имени или отчества; «е» и «ё» не различаются.</div>`);
}

function openQr(p) {
  const r = rng(p.id * 991 + 7), N = 25, c = 8;
  let cells = "";
  const finder = (x, y) => `<rect x="${x * c}" y="${y * c}" width="${7 * c}" height="${7 * c}" fill="#111"/><rect x="${(x + 1) * c}" y="${(y + 1) * c}" width="${5 * c}" height="${5 * c}" fill="#fff"/><rect x="${(x + 2) * c}" y="${(y + 2) * c}" width="${3 * c}" height="${3 * c}" fill="#111"/>`;
  const inFinder = (x, y) => (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!inFinder(x, y) && r() < 0.48) cells += `<rect x="${x * c}" y="${y * c}" width="${c}" height="${c}" fill="#111"/>`;
  const code = Array.from({ length: 8 }, () => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(r() * 32)]).join("");
  openModal(`
    <h2>Привязка телефона пациента</h2>
    <div class="qr">
      <svg viewBox="0 0 ${N * c} ${N * c}">${cells}${finder(0, 0)}${finder(N - 7, 0)}${finder(0, N - 7)}</svg>
      <div>
        <div class="small muted">Пациент</div><div style="font-weight:600;margin-bottom:10px">${esc(fullName(p))}</div>
        <div class="small muted">Одноразовый код</div><div class="code">${code.slice(0, 4)}-${code.slice(4)}</div>
        <p class="small muted">Пациент открывает приложение KardioMonitor и сканирует QR. Имя вводить не нужно. Код действует 24 часа и срабатывает один раз.</p>
      </div>
    </div>
    <div class="modal-actions"><button class="btn" onclick="window.print()">Печать</button><button class="btn primary" data-close>Готово</button></div>`);
}

function drawProgress(p) {
  const g = progress(p);
  const st = g.stage, n = p.total;
  const cols = `grid-template-columns: repeat(${n}, minmax(0, 1fr))`;
  const bands = p.stages.map((s, i) => `<div class="stage-band ${s === st && !g.done ? "cur" : ""}" style="grid-column:${s.from} / ${s.to + 1}" title="Этап ${i + 1}: дни ${s.from}–${s.to}">
      <b>Этап ${i + 1}</b> · дни ${s.from}–${s.to} · ${s.lo}–${s.hi} уд/мин · ${s.min} мин · ${fmt(s.steps)} шагов</div>`).join("");
  let cells = "";
  for (let d = 1; d <= n; d++) {
    let cls = "future", label = "впереди", x = "";
    if (d < p.dayIdx) {
      const s = p.sum[d];
      if (s.noData) { cls = "nodata"; label = "нет данных — норма не выполнена"; }
      else if (s.met) { cls = "met"; label = `норма выполнена: ${s.training} из ${s.st.min} мин, ${fmt(s.steps)} из ${fmt(s.st.steps)} шагов`; x = "✓"; }
      else { cls = "missed"; label = `норма не выполнена: ${s.training} из ${s.st.min} мин, ${fmt(s.steps)} из ${fmt(s.st.steps)} шагов`; x = "✕"; }
    } else if (d === p.dayIdx) { cls = "today"; label = "сегодня, день не закончился"; }
    cells += `<button class="daycell ${cls} ${d === pState.day ? "sel" : ""}" data-day="${d}" ${cls === "future" ? "disabled" : ""} aria-label="День ${d}, ${dShort(dateOf(p, d))}: ${label}" data-tip="<b>День ${d}</b> · ${dShort(dateOf(p, d))}<br>${label}"><span class="x">${x}</span></button>`;
  }
  const ticks = [];
  for (let d = 1; d <= n; d++) if (d === 1 || d === n || d % 7 === 0 || d === p.dayIdx) ticks.push(`<span style="grid-column:${d}">${d === p.dayIdx && !g.done ? "<b>" + d + "</b>" : d}</span>`);
  const head = g.done
    ? `<div><div class="lbl">Программа</div><div class="big">Завершена</div><div class="small muted">${n} дней, ${dShort(dateOf(p, 1))} – ${dShort(dateOf(p, n))}</div></div>
       <div><div class="lbl">Норма дня выполнена</div><div class="big">в ${g.met} <small>${daysWord(g.met)} из ${n}</small></div><div class="small muted">${Math.round(g.met / n * 100)}% дней программы</div></div>
       <div><div class="lbl">После программы</div><div class="big" style="font-size:18px">Данные продолжают приходить</div><div class="small muted">«Высокий пульс» проверяется всегда; дневные оповещения — только в дни программы</div></div>`
    : `<div><div class="lbl">Прошло дней</div><div class="big">День ${g.day} <small>из ${n}</small></div>
         <div class="meter prog" style="margin-top:8px"><span style="width:${g.day / n * 100}%"></span></div>
         <div class="small muted" style="margin-top:6px">начало ${dNum(dateOf(p, 1))} · конец ${dNum(dateOf(p, n))}</div></div>
       <div><div class="lbl">Норма дня выполнена</div><div class="big">${g.completed ? `в ${g.met} <small>${daysWord(g.met)} из ${g.completed}</small>` : `<small>пока нет завершённых дней</small>`}</div>
         <div class="small muted" style="margin-top:6px">считаются завершённые сутки; сегодня — после полуночи</div></div>
       <div><div class="lbl">Текущий этап</div><div class="big">Этап ${stageNo(p, st)}: <small>дни ${st.from}–${st.to}</small></div>
         <div class="small muted" style="margin-top:6px">зона ${st.lo}–${st.hi} уд/мин · ${st.min} трен. мин · ${fmt(st.steps)} шагов в день</div></div>`;
  const el = document.getElementById("progress-card");
  el.innerHTML = `<div class="card-head"><h2>Прогресс реабилитации</h2><span class="small muted">нажмите на день, чтобы открыть его</span></div>
    <div class="prog-top">${head}</div>
    <div class="strip" style="${cols};margin-bottom:6px">${bands}</div>
    <div class="strip" style="${cols}">${cells}</div>
    <div class="strip-axis" style="grid-template-columns: repeat(${n}, minmax(0, 1fr))">${ticks.join("")}</div>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>норма выполнена ✓</span>
      <span><i style="background:var(--hr-high);opacity:.85"></i>не выполнена ✕</span>
      <span><i style="background:repeating-linear-gradient(135deg,var(--nodata) 0 3px,transparent 3px 6px);border:1px solid var(--nodata)"></i>нет данных</span>
      <span><i style="border:2px solid var(--text)"></i>сегодня</span>
      <span><i style="background:var(--track)"></i>впереди</span>
    </div>`;
  el.querySelectorAll(".daycell:not(.future)").forEach(b => {
    b.addEventListener("click", () => { pState.day = +b.dataset.day; drawProgress(p); drawDay(p); drawDist(p); });
    b.addEventListener("mousemove", e => showTip(b.dataset.tip, e.clientX, e.clientY));
    b.addEventListener("mouseleave", hideTip);
  });
}

/* ТР-03 + ТР-04 п.3: день пациента */
function drawDay(p) {
  const d = pState.day, s = p.sum[d], st = s.st, day = genDay(p, d);
  const date = dateOf(p, d);
  const isToday = d === p.dayIdx;
  const done = programDone(p);
  let verdict;
  if (s.noData) verdict = `<span class="tag neutral">нет данных</span>`;
  else if (s.met) verdict = `<span class="tag ok">✓ выполнена</span>`;
  else if (isToday) verdict = `<span class="tag neutral">пока не выполнена</span>`;
  else verdict = `<span class="tag bad">✕ не выполнена</span>`;
  const why = s.noData ? (isToday ? "минуты за сегодня ещё не пришли" : "за день нет минут — норма не выполнена")
    : s.met ? "тренировочных минут и шагов не меньше нормы"
    : [!s.minOk && `не хватает ${st.min - s.training} трен. мин`, !s.stepsOk && `не хватает ${fmt(st.steps - s.steps)} шагов`].filter(Boolean).join(", ");
  const noHr = Math.round(s.noHrShare * 100);
  const el = document.getElementById("day-card");
  el.innerHTML = `
    <div class="dayhead">
      <h2>День ${d}${d <= p.total ? ` из ${p.total}` : ""} · ${WEEKDAYS[date.getDay()]}, ${date.getDate()} ${MONTHS_FULL[date.getMonth()]}</h2>
      ${isToday ? `<span class="tag neutral">день не закончился — итог «пока»</span>` : `<span class="tag neutral">итог дня</span>`}
      <span class="small muted">этап ${stageNo(p, st)} · зона ${st.lo}–${st.hi} уд/мин · порог ходьбы ${p.settings.walk} шагов/мин</span>
      <span style="flex:1"></span>
      <div class="daynav">
        <button class="btn small" id="dprev" ${d <= 1 ? "disabled" : ""}>‹ Предыдущий</button>
        <button class="btn small" id="dnext" ${d >= Math.min(p.dayIdx, done ? p.total : p.dayIdx) ? "disabled" : ""}>Следующий ›</button>
        ${d !== p.dayIdx && !done ? `<button class="btn small" id="dtoday">Сегодня</button>` : ""}
      </div>
    </div>
    ${isToday && !s.noData ? `<div class="notice" style="margin-top:12px"><span>ⓘ</span><span>Данные до <b>${hm(s.cutoff)}</b> по времени пациента: телефон отправил их ${agoText(p.lag)}. Минуты приходят с задержкой синхронизации 30–60 мин; поздние минуты пересчитают итог дня.</span></div>` : ""}
    <div class="tiles">
      <div class="tile">
        <div class="lbl">Тренировочные минуты</div>
        <div class="big">${s.training} <small>из ${st.min} мин</small></div>
        <div class="meter ${s.minOk ? "ok" : ""}"><span style="width:${Math.min(100, s.training / st.min * 100)}%"></span></div>
        <div class="sub">ходьба ${s.walk} мин: в зоне ${s.training}, выше ${s.walkAbove}, ниже ${s.walkBelow}, без пульса ${s.walkNoHr}</div>
      </div>
      <div class="tile">
        <div class="lbl">Шаги за день</div>
        <div class="big">${fmt(s.steps)} <small>из ${fmt(st.steps)}</small></div>
        <div class="meter ${s.stepsOk ? "ok" : ""}"><span style="width:${Math.min(100, s.steps / st.steps * 100)}%"></span></div>
        <div class="sub">все шаги дня, не только в минуты ходьбы</div>
      </div>
      <div class="tile">
        <div class="lbl">Норма дня</div>
        <div style="margin-top:6px">${verdict}</div>
        <div class="sub">${why}${p.sum[d] && !s.noData ? "" : ""}</div>
      </div>
      <div class="tile">
        <div class="lbl">Минут без пульса</div>
        <div class="big">${s.noData ? "—" : noHr + "%"} <small>${s.noData ? "" : "браслет надет"}</small></div>
        <div class="sub">${!s.noData && noHr >= 10 ? `<span style="color:var(--warn)">Пульс мерялся не каждую минуту — тренировочных минут может быть больше, чем видно. Попросите пациента включить измерение пульса раз в минуту.</span>` : "пульс измерен почти в каждой минуте"}</div>
      </div>
    </div>
    <div class="chart-title"><h3>Пульс по минутам</h3>
      <div class="legend" style="margin:0">
        <span><i class="line" style="background:var(--hr-below)"></i>ниже зоны</span>
        <span><i class="line" style="background:var(--hr-zone)"></i>в зоне ${st.lo}–${st.hi}</span>
        <span><i class="line" style="background:var(--hr-above)"></i>выше зоны</span>
        <span><i class="line" style="background:var(--hr-high)"></i>выше порога ${p.settings.high}</span>
      </div>
    </div>
    <div class="chart-wrap" id="hr-chart">${hrChart(p, day)}</div>
    <div class="legend" style="margin-top:6px">
      <span><i style="background:var(--sleep)"></i>сон</span>
      <span><i style="background:var(--hr-zone)"></i>ходьба</span>
      <span><i style="background:repeating-linear-gradient(135deg,var(--text-muted) 0 2px,transparent 2px 4px)"></i>браслет снят</span>
      <span><i style="background:var(--text-muted)"></i>зарядка</span>
    </div>
    <div class="chart-title" style="margin-top:18px"><h3>Шаги по часам</h3><span class="small muted">наведите на столбец</span></div>
    <div class="chart-wrap" id="steps-chart">${stepsChart(day)}</div>`;
  const go = v => { pState.day = v; drawProgress(p); drawDay(p); drawDist(p); };
  el.querySelector("#dprev").addEventListener("click", () => go(d - 1));
  el.querySelector("#dnext").addEventListener("click", () => go(d + 1));
  const t = el.querySelector("#dtoday"); if (t) t.addEventListener("click", () => go(p.dayIdx));
  bindHrHover(p, day);
  bindStepsHover(day);
}

const HR_W = 1000, HR_H = 270, PL = 38, PR = 10, PT = 8, PB = 52, HR_MIN = 40, HR_MAX = 170;
const X = t => PL + t / 1440 * (HR_W - PL - PR);
const Y = v => PT + (1 - (Math.min(HR_MAX, Math.max(HR_MIN, v)) - HR_MIN) / (HR_MAX - HR_MIN)) * (HR_H - PT - PB);
function hrCat(hr, st, thr) { return hr > thr ? "high" : hr > st.hi ? "above" : hr < st.lo ? "below" : "zone"; }

function hrChart(p, day) {
  const st = day.st, thr = p.settings.high, plotB = HR_H - PB;
  let g = "";
  for (let v = 40; v <= 160; v += 20) g += `<line class="gridline" x1="${PL}" x2="${HR_W - PR}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis-label" x="${PL - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  g += `<rect x="${PL}" width="${HR_W - PL - PR}" y="${Y(st.hi)}" height="${Y(st.lo) - Y(st.hi)}" fill="var(--hr-zone)" opacity=".1"/>`;
  g += `<text class="axis-label" x="${HR_W - PR - 4}" y="${Y(st.hi) + 13}" text-anchor="end" style="fill:var(--hr-zone)">зона ${st.lo}–${st.hi}</text>`;
  g += `<line x1="${PL}" x2="${HR_W - PR}" y1="${Y(thr)}" y2="${Y(thr)}" stroke="var(--hr-high)" stroke-dasharray="4 4" stroke-width="1"/>`;
  g += `<text class="axis-label" x="${HR_W - PR - 4}" y="${Y(thr) - 5}" text-anchor="end" style="fill:var(--hr-high)">порог ${thr}</text>`;
  if (day.cutoff < 1440) {
    const x0 = X(day.cutoff);
    g += `<defs><pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="var(--grid)" stroke-width="3"/></pattern></defs>`;
    g += `<rect x="${x0}" y="${PT}" width="${HR_W - PR - x0}" height="${plotB - PT}" fill="url(#hatch)"/>`;
    if (day.cutoff > 0) g += `<line x1="${x0}" x2="${x0}" y1="${PT}" y2="${plotB}" stroke="var(--text-muted)" stroke-width="1"/><text class="axis-label" x="${x0 + 6}" y="${PT + 12}">данные ещё не пришли</text>`;
  }
  const paths = { below: "", zone: "", above: "", high: "" };
  let prev = null, any = false;
  day.mins.forEach((m, t) => {
    if (!m || m.hr == null) { prev = null; return; }
    any = true;
    const pt = `${X(t).toFixed(1)},${Y(m.hr).toFixed(1)}`;
    const c = hrCat(m.hr, st, thr);
    paths[c] += prev ? `M${prev}L${pt}` : `M${pt}l0.5,0`;
    prev = pt;
  });
  for (const c of ["below", "zone", "above", "high"]) g += `<path d="${paths[c]}" fill="none" stroke="var(--hr-${c})" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>`;
  if (!any) g += `<text x="${HR_W / 2}" y="${(PT + plotB) / 2}" text-anchor="middle" style="fill:var(--text-muted);font-size:14px">Пульса за этот день нет</text>`;
  // Полоса активности
  const ay = plotB + 6, ah = 9;
  const runs = [];
  day.mins.forEach((m, t) => {
    let k = null;
    if (m) k = m.kind === "sleep" ? "sleep" : m.kind === "off" ? "off" : m.kind === "charge" ? "charge" : m.steps > p.settings.walk ? "walk" : null;
    const last = runs[runs.length - 1];
    if (last && last.k === k && last.e === t) last.e = t + 1; else if (k) runs.push({ k, s: t, e: t + 1 });
  });
  const fill = { sleep: "var(--sleep)", walk: "var(--hr-zone)", off: "url(#offh)", charge: "var(--text-muted)" };
  g += `<defs><pattern id="offh" width="4" height="4" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="4" stroke="var(--text-muted)" stroke-width="2"/></pattern></defs>`;
  g += `<rect x="${PL}" y="${ay}" width="${HR_W - PL - PR}" height="${ah}" rx="3" fill="var(--track)"/>`;
  runs.forEach(r => g += `<rect x="${X(r.s)}" y="${ay}" width="${Math.max(1.5, X(r.e) - X(r.s))}" height="${ah}" fill="${fill[r.k]}"/>`);
  for (let h = 0; h <= 24; h += 3) g += `<text class="axis-label" x="${X(h * 60)}" y="${HR_H - 12}" text-anchor="${h === 0 ? "start" : h === 24 ? "end" : "middle"}">${pad(h)}:00</text>`;
  g += `<line id="hr-cross" y1="${PT}" y2="${plotB}" stroke="var(--text)" stroke-width="1" opacity="0"/><circle id="hr-dot" r="4.5" fill="var(--surface)" stroke="var(--text)" stroke-width="2" opacity="0"/>`;
  g += `<rect id="hr-hit" x="${PL}" y="0" width="${HR_W - PL - PR}" height="${HR_H}" fill="transparent"/>`;
  return `<svg viewBox="0 0 ${HR_W} ${HR_H}" role="img" aria-label="Пульс по минутам за день">${g}</svg>`;
}
function bindHrHover(p, day) {
  const svg = document.querySelector("#hr-chart svg");
  const hit = svg.querySelector("#hr-hit"), cross = svg.querySelector("#hr-cross"), dot = svg.querySelector("#hr-dot");
  hit.addEventListener("mousemove", e => {
    const r = svg.getBoundingClientRect();
    const vx = (e.clientX - r.left) / r.width * HR_W;
    const t = Math.max(0, Math.min(1439, Math.round((vx - PL) / (HR_W - PL - PR) * 1440)));
    let m = day.mins[t], tt = t;
    if (m && m.hr == null) for (let k = 1; k <= 2; k++) { if (day.mins[t + k]?.hr != null) { tt = t + k; break; } if (day.mins[t - k]?.hr != null) { tt = t - k; break; } }
    m = day.mins[tt];
    cross.setAttribute("x1", X(tt)); cross.setAttribute("x2", X(tt)); cross.setAttribute("opacity", ".35");
    if (m && m.hr != null) { dot.setAttribute("cx", X(tt)); dot.setAttribute("cy", Y(m.hr)); dot.setAttribute("opacity", "1"); }
    else dot.setAttribute("opacity", "0");
    const c = classify(m, day.st, p.settings.walk);
    const html = m
      ? `<b>${hm(tt)}</b> · пульс ${m.hr != null ? `<b>${m.hr}</b> уд/мин` : "не измерен"}<br>${m.steps} шагов/мин · ${CLASS_TEXT[c]}`
      : `<b>${hm(tt)}</b> · ${tt >= day.cutoff ? "данные ещё не пришли" : "данных нет"}`;
    showTip(html, e.clientX, e.clientY);
  });
  hit.addEventListener("mouseleave", () => { hideTip(); cross.setAttribute("opacity", "0"); dot.setAttribute("opacity", "0"); });
}

const ST_W = 1000, ST_H = 140, SB = 24;
function stepsChart(day) {
  const hours = new Array(24).fill(0), has = new Array(24).fill(false);
  day.mins.forEach((m, t) => { if (m) { hours[Math.floor(t / 60)] += m.steps; has[Math.floor(t / 60)] = true; } });
  const max = Math.max(1000, ...hours);
  const top = Math.ceil(max / 1000) * 1000;
  const yy = v => PT + (1 - v / top) * (ST_H - PT - SB);
  let g = "";
  const step = top > 4000 ? 2000 : 1000;
  for (let v = 0; v <= top; v += step) g += `<line class="gridline" x1="${PL}" x2="${ST_W - PR}" y1="${yy(v)}" y2="${yy(v)}"/><text class="axis-label" x="${PL - 6}" y="${yy(v) + 4}" text-anchor="end">${v ? fmt(v) : 0}</text>`;
  const bw = (ST_W - PL - PR) / 24;
  hours.forEach((v, h) => {
    const x = PL + h * bw + 2, w = bw - 4, y = yy(v), base = yy(0);
    if (v > 0) g += `<path d="M${x},${base}V${y + 3}a3,3 0 0 1 3,-3H${x + w - 3}a3,3 0 0 1 3,3V${base}Z" fill="var(--steps)"/>`;
    else if (!has[h]) g += `<rect x="${x}" y="${base - 2}" width="${w}" height="2" fill="var(--nodata)"/>`;
    g += `<rect class="sbar" data-h="${h}" x="${PL + h * bw}" y="${PT}" width="${bw}" height="${ST_H - PT - SB}" fill="transparent"/>`;
    if (h % 3 === 0) g += `<text class="axis-label" x="${x + w / 2}" y="${ST_H - 6}" text-anchor="middle">${pad(h)}</text>`;
  });
  day._hours = hours; day._has = has;
  return `<svg viewBox="0 0 ${ST_W} ${ST_H}" role="img" aria-label="Шаги по часам">${g}</svg>`;
}
function bindStepsHover(day) {
  document.querySelectorAll("#steps-chart .sbar").forEach(b => {
    b.addEventListener("mousemove", e => {
      const h = +b.dataset.h;
      showTip(`<b>${pad(h)}:00–${pad(h + 1)}:00</b><br>${day._has[h] ? fmt(day._hours[h]) + " шагов" : "данных нет"}`, e.clientX, e.clientY);
      b.setAttribute("fill", "color-mix(in srgb, var(--text) 6%, transparent)");
    });
    b.addEventListener("mouseleave", () => { hideTip(); b.setAttribute("fill", "transparent"); });
  });
}

/* ТР-04: распределение пульса */
function drawDist(p) {
  const d = pState.day;
  const range = pState.dist === "day" ? [d, d] : pState.dist === "week" ? [Math.max(1, d - 6), d] : [1, Math.min(p.dayIdx, p.total)];
  const labels = ["< 40", "40–49", "50–59", "60–69", "70–79", "80–89", "90–99", "100–109", "110–119", "120+"];
  const counts = new Array(10).fill(0);
  let total = 0;
  for (let k = range[0]; k <= range[1]; k++) {
    for (const m of genDay(p, k).mins) {
      if (!m || m.hr == null) continue;
      total++;
      counts[m.hr < 40 ? 0 : m.hr >= 120 ? 9 : Math.floor(m.hr / 10) - 3]++;
    }
  }
  const st = stageFor(p, d), max = Math.max(1, ...counts);
  const lo = [0, 40, 50, 60, 70, 80, 90, 100, 110, 120], hi = [39, 49, 59, 69, 79, 89, 99, 109, 119, 999];
  const rows = labels.map((l, i) => {
    const cls = lo[i] > p.settings.high ? "high" : lo[i] > st.hi ? "above" : hi[i] < st.lo ? "" : (lo[i] >= st.lo && hi[i] <= st.hi) ? "zone" : "zone";
    const share = total ? counts[i] / total * 100 : 0;
    const hhmm = counts[i] >= 60 ? `${Math.floor(counts[i] / 60)} ч ${counts[i] % 60} мин` : `${counts[i]} мин`;
    return `<div class="dist-row ${cls}"><span class="rl">${l}</span><div>${counts[i] ? `<div class="bar" style="width:${counts[i] / max * 100}%"></div>` : ""}</div><span class="num">${hhmm} <span>${share < 1 && share > 0 ? "<1" : Math.round(share)}%</span></span></div>`;
  }).join("");
  const title = pState.dist === "day" ? `день ${d}` : `дни ${range[0]}–${range[1]}`;
  const el = document.getElementById("dist-card");
  el.innerHTML = `<div class="card-head"><h2>Распределение пульса</h2>
      <div class="seg">${[["day", "День"], ["week", "Неделя"], ["program", "Вся программа"]].map(([k, l]) => `<button data-dist="${k}" class="${pState.dist === k ? "on" : ""}">${l}</button>`).join("")}</div></div>
    <div class="small muted" style="margin:-6px 0 12px">${title} · минут с измеренным пульсом: ${fmt(total)} (сумма по интервалам)</div>
    ${total ? rows : `<div class="empty">За выбранный период пульса нет</div>`}
    <div class="legend">
      <span><i style="background:var(--hr-below)"></i>ниже зоны</span>
      <span><i style="background:var(--hr-zone)"></i>затрагивает зону ${st.lo}–${st.hi}</span>
      <span><i style="background:var(--hr-above)"></i>выше зоны</span>
      <span><i style="background:var(--hr-high)"></i>выше порога ${p.settings.high}</span>
    </div>`;
  el.querySelectorAll("[data-dist]").forEach(b => b.addEventListener("click", () => { pState.dist = b.dataset.dist; drawDist(p); }));
}

/* ТР-09: пульс в прямом режиме по запросу */
let liveTimers = [];
function stopLive() { liveTimers.forEach(clearInterval); liveTimers.forEach(clearTimeout); liveTimers = []; }
const LIVE_LABEL = {
  waiting: ["Ожидает телефон", "neutral"], running: ["Идёт", "ok"], done: ["Завершён", "neutral"],
  stopped: ["Остановлен пациентом", "warn"], failed: ["Не выполнен: срок истёк", "bad"], cancelled: ["Отменён", "neutral"],
};
function drawLive(p) {
  const el = document.getElementById("live-card");
  const L = pState.live;
  const nowL = localNow(p);
  const hist = `<div class="req-hist"><div class="small muted" style="border:0;padding-bottom:2px">Прошлые запросы</div>
      <div><span>${dShort(dateOf(p, p.dayIdx - 2))}, 11:20 · 10 мин</span><span class="tag neutral">завершён</span></div>
      <div><span>${dShort(dateOf(p, p.dayIdx - 5))}, 18:05 · 15 мин</span><span class="tag bad">срок истёк</span></div></div>`;
  let body;
  if (!L || ["done", "stopped", "failed", "cancelled"].includes(L.state)) {
    body = `${L ? `<div class="live-state"><span class="tag ${LIVE_LABEL[L.state][1]}">${LIVE_LABEL[L.state][0]}</span><span class="small muted">${L.note || ""}</span></div>` : ""}
      <div class="form-row">
        <label class="small muted" for="live-n">Длительность</label>
        <input class="input tnum" id="live-n" type="number" min="1" max="60" value="10" style="width:84px"> <span class="small muted">мин (1–60)</span>
        <button class="btn primary" id="live-go">Запросить пульс сейчас</button>
      </div>
      <div class="errors" id="live-err"></div>
      <div class="notice" style="margin-top:12px"><span>ⓘ</span><span>Телефон получит запрос при следующей синхронизации, обычно в течение 30 минут. Если телефон не заберёт запрос за 2 часа, запрос не выполняется. Пациент видит уведомление об измерении и может его остановить.</span></div>`;
  } else if (L.state === "waiting") {
    body = `<div class="live-state"><span class="spinner"></span><span class="tag neutral">Ожидает телефон</span><span class="small muted">запрошено в ${hm(nowL)} на ${L.n} мин · действует до ${hm(nowL + 120)}</span></div>
      <div class="notice"><span>ⓘ</span><span>Телефон получит запрос при следующей синхронизации, обычно в течение 30 минут.</span></div>
      <div class="form-row" style="margin-top:12px">
        <button class="btn" id="live-cancel">Отменить запрос</button>
        <span style="flex:1"></span>
        <span class="small muted">прототип:</span>
        <button class="btn small sim" id="sim-sync">телефон синхронизировался</button>
        <button class="btn small sim" id="sim-expire">прошло 2 ч</button>
      </div>`;
  } else {
    const left = Math.max(0, L.n * 60 - L.elapsed);
    const vals = L.values.slice(-60);
    const sp = vals.length > 1 ? vals.map((v, i) => `${(i / 59 * 300).toFixed(1)},${(60 - (v - 60) / 80 * 56).toFixed(1)}`).join(" ") : "";
    const cur = vals[vals.length - 1];
    body = `<div class="live-state"><span class="tag ok">● Идёт</span><span class="small muted">осталось ${Math.floor(left / 60)}:${pad(left % 60)} · значение каждые 2–3 с</span></div>
      <div style="display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap">
        <div class="live-big"><span class="heartbeat" style="font-size:28px;vertical-align:8px">♥</span> ${cur ?? "—"}<small>уд/мин</small></div>
        <svg viewBox="0 0 300 64" style="flex:1;min-width:180px;height:64px" aria-label="Пульс за последние минуты">
          <line x1="0" x2="300" y1="${60 - (p.settings.high - 60) / 80 * 56}" y2="${60 - (p.settings.high - 60) / 80 * 56}" stroke="var(--hr-high)" stroke-dasharray="3 3" opacity=".7"/>
          <polyline points="${sp}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="form-row" style="margin-top:14px">
        <button class="btn" id="live-cancel">Остановить</button>
        <span style="flex:1"></span>
        <span class="small muted">прототип:</span>
        <button class="btn small sim" id="sim-stop">пациент остановил</button>
        <button class="btn small sim" id="sim-end">время вышло</button>
      </div>`;
  }
  el.innerHTML = `<div class="card-head"><h2>Пульс сейчас</h2><span class="small muted">по запросу врача, ТР-09</span></div>${body}${hist}`;
  const $ = s => el.querySelector(s);
  if ($("#live-go")) $("#live-go").addEventListener("click", () => {
    const n = +$("#live-n").value;
    if (!(n >= 1 && n <= 60) || !Number.isInteger(n)) { $("#live-err").innerHTML = `<div class="notice bad">Длительность — целое число от 1 до 60 минут</div>`; return; }
    pState.live = { state: "waiting", n, values: [], elapsed: 0 }; drawLive(p);
  });
  const finish = (state, note) => { stopLive(); pState.live.state = state; pState.live.note = note; drawLive(p); };
  if ($("#live-cancel")) $("#live-cancel").addEventListener("click", () => finish("cancelled", "запрос отменён врачом"));
  if ($("#sim-expire")) $("#sim-expire").addEventListener("click", () => finish("failed", "телефон не синхронизировался 2 ч"));
  if ($("#sim-stop")) $("#sim-stop").addEventListener("click", () => finish("stopped", `пациент нажал «Остановить» через ${Math.ceil(pState.live.elapsed / 60)} мин`));
  if ($("#sim-end")) $("#sim-end").addEventListener("click", () => finish("done", `${pState.live.n} мин, ${pState.live.values.length} значений`));
  if ($("#sim-sync")) $("#sim-sync").addEventListener("click", () => {
    const L = pState.live; L.state = "running";
    const r = rng(Date.now() & 0xffff); let v = 78 + Math.round(r() * 10);
    for (let i = 0; i < 12; i++) { v = Math.max(60, Math.min(135, v + Math.round((r() - 0.5) * 6))); L.values.push(v); }
    liveTimers.push(setInterval(() => {
      if (!document.getElementById("live-card")) return stopLive();
      v = Math.max(60, Math.min(135, v + Math.round((r() - 0.48) * 6)));
      L.values.push(v); L.elapsed += 2.5;
      if (L.elapsed >= L.n * 60) return finish("done", `${L.n} мин, ${L.values.length} значений`);
      drawLive(p);
    }, 2500));
    drawLive(p);
  });
}

/* ТР-08: оповещения пациента */
const paState = { kind: "all" };
function drawPatientAlerts(p) {
  const all = ALERTS.filter(a => a.pid === p.id).sort((a, b) => b.abs - a.abs);
  const list = all.filter(a => paState.kind === "all" || a.kind === paState.kind);
  const unseen = all.filter(a => !a.seen).length;
  const el = document.getElementById("palerts-card");
  el.innerHTML = `<div class="card-head"><h2>Оповещения</h2>
      <div class="form-row">
        ${unseen ? `<span class="badge">${unseen}</span>` : ""}
        <select class="input" id="pakind" style="padding:5px 10px;font-size:13px" aria-label="Вид оповещения"><option value="all">Все виды</option>${Object.entries(ALERT_KIND).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join("")}</select>
      </div></div>
    <div class="small muted" style="margin:-6px 0 6px">Дневные оповещения в ${p.settings.alertUtc} UTC = ${utcToLocal(p.settings.alertUtc, p.tz)} у пациента · пациент получает их при синхронизации</div>
    <div style="max-height:440px;overflow:auto;margin:0 -8px">${list.map(a => alertItem(a, false)).join("") || `<div class="empty">Оповещений нет</div>`}</div>
    ${unseen ? `<button class="btn small" id="pa-all" style="margin-top:10px">Отметить все просмотренными</button>` : ""}
    ${DISCLAIMER}`;
  el.querySelector("#pakind").value = paState.kind;
  el.querySelector("#pakind").addEventListener("change", e => { paState.kind = e.target.value; drawPatientAlerts(p); });
  const b = el.querySelector("#pa-all");
  if (b) b.addEventListener("click", () => { all.forEach(a => a.seen = true); updateNavBadge(); drawPatientAlerts(p); });
  bindSeen(el, () => drawPatientAlerts(p));
}

/* ТР-01: программа, этапы, параметры наблюдения */
function drawProgram(p, draft) {
  const D = draft || { total: p.total, stages: p.stages.map(s => ({ ...s })), settings: { ...p.settings } };
  const el = document.getElementById("program-card");
  const today = Math.min(p.dayIdx, p.total);
  el.innerHTML = `<div class="card-head"><h2>Программа и нормы</h2><span class="small muted">начало ${dNum(dateOf(p, 1))}</span></div>
    <div class="form-row" style="margin-bottom:12px">
      <label class="small muted" for="pg-total">Длительность программы</label>
      <input class="input tnum" id="pg-total" type="number" value="${D.total}" style="width:84px;text-align:right"> <span class="small muted">дней (1–365)</span>
    </div>
    <table class="stages">
      <thead><tr><th style="width:26px"></th><th>Дни</th><th>Зона пульса, уд/мин</th><th>Трен. мин</th><th>Шагов в день</th><th></th></tr></thead>
      <tbody>${D.stages.map((s, i) => `<tr data-i="${i}">
        <td class="small muted">${i + 1}</td>
        <td><div class="range"><input class="input" data-k="from" value="${s.from}"><span>–</span><input class="input" data-k="to" value="${s.to}"></div></td>
        <td><div class="range"><input class="input" data-k="lo" value="${s.lo}"><span>–</span><input class="input" data-k="hi" value="${s.hi}"></div></td>
        <td><input class="input" data-k="min" value="${s.min}"></td>
        <td><input class="input" data-k="steps" value="${s.steps}"></td>
        <td>${D.stages.length > 1 ? `<button class="btn small ghost" data-del="${i}" aria-label="Удалить этап">✕</button>` : ""}</td>
      </tr>`).join("")}</tbody>
    </table>
    <button class="btn small" id="pg-add" style="margin-top:8px">＋ Этап</button>
    <div class="section-sep"></div>
    <h3 style="margin-bottom:4px">Параметры наблюдения</h3>
    <div class="settings-grid">
      <div class="field"><label>Порог ходьбы, шагов в минуту</label><input class="input tnum" data-s="walk" value="${D.settings.walk}"><div class="hint">больше порога — минута ходьбы</div></div>
      <div class="field"><label>Порог высокого пульса, уд/мин</label><input class="input tnum" data-s="high" value="${D.settings.high}"><div class="hint">выше — оповещение «Высокий пульс»</div></div>
      <div class="field"><label>Порог «почти не ходит», шагов в день</label><input class="input tnum" data-s="low" value="${D.settings.low}"></div>
      <div class="field"><label>Время дневных оповещений, UTC</label><input class="input tnum" type="time" data-s="alertUtc" value="${D.settings.alertUtc}"><div class="hint" id="pg-local">= ${utcToLocal(D.settings.alertUtc, p.tz)} у пациента (${tzText(p.tz)})</div></div>
    </div>
    <div class="errors" id="pg-err"></div>
    <div class="form-row" style="margin-top:16px">
      <button class="btn primary" id="pg-save">Сохранить</button>
      <button class="btn ghost" id="pg-reset">Сбросить</button>
      <span class="small muted">Изменения действуют с сегодняшнего дня${programDone(p) ? "" : ` (день ${today})`}; прошедшие дни оцениваются прежними нормами.</span>
    </div>`;
  const read = () => {
    D.total = +el.querySelector("#pg-total").value;
    el.querySelectorAll("tbody tr").forEach(tr => {
      const s = D.stages[+tr.dataset.i];
      tr.querySelectorAll("[data-k]").forEach(inp => s[inp.dataset.k] = inp.value.trim() === "" ? NaN : +inp.value);
    });
    el.querySelectorAll("[data-s]").forEach(inp => D.settings[inp.dataset.s] = inp.dataset.s === "alertUtc" ? inp.value : +inp.value);
  };
  el.querySelector("[data-s=alertUtc]").addEventListener("input", e => {
    if (e.target.value) el.querySelector("#pg-local").textContent = `= ${utcToLocal(e.target.value, p.tz)} у пациента (${tzText(p.tz)})`;
  });
  el.querySelector("#pg-add").addEventListener("click", () => {
    read();
    const last = D.stages[D.stages.length - 1];
    const mid = Math.min(D.total - 1, Math.max(last.from, Math.floor((last.from + last.to) / 2)));
    D.stages.push({ ...last, from: mid + 1, to: last.to }); last.to = mid;
    drawProgram(p, D);
  });
  el.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => { read(); D.stages.splice(+b.dataset.del, 1); drawProgram(p, D); }));
  el.querySelector("#pg-reset").addEventListener("click", () => drawProgram(p));
  el.querySelector("#pg-save").addEventListener("click", () => {
    read();
    const errs = validateProgram(D);
    el.querySelector("#pg-err").innerHTML = errs.length
      ? errs.map(e => `<div class="notice bad">${e}</div>`).join("")
      : `<div class="notice ok">Сохранено. Новые нормы действуют с ${programDone(p) ? "сегодняшнего дня" : `дня ${today}`}; дни 1–${Math.max(1, today - 1)} остаются оценены нормами, которые тогда действовали.</div>`;
  });
}
function validateProgram(D) {
  const e = [];
  const ok = (v, a, b) => Number.isInteger(v) && v >= a && v <= b;
  if (!ok(D.total, 1, 365)) e.push("Длительность программы — от 1 до 365 дней");
  const st = [...D.stages].sort((a, b) => a.from - b.from);
  st.forEach((s, i) => {
    const name = `Этап «${s.from}–${s.to}»`;
    if (!Number.isInteger(s.from) || !Number.isInteger(s.to) || s.from > s.to) e.push(`${name}: первый день должен быть не больше последнего`);
    if (s.lo >= s.hi) e.push(`${name}: нижняя граница должна быть меньше верхней`);
    else if (!(s.lo >= 40 && s.hi <= 220)) e.push(`${name}: зона пульса — в пределах 40–220 уд/мин`);
    if (!ok(s.min, 1, 1440)) e.push(`${name}: тренировочных минут — от 1 до 1440`);
    if (!ok(s.steps, 0, 100000)) e.push(`${name}: шагов в день — от 0 до 100 000`);
  });
  if (!e.length && ok(D.total, 1, 365)) {
    let next = 1;
    for (const s of st) {
      if (s.from > next) e.push(`Дни ${next}–${s.from - 1} не входят ни в один этап`);
      if (s.from < next) e.push(`Дни ${s.from}–${Math.min(s.to, next - 1)} входят в несколько этапов`);
      next = Math.max(next, s.to + 1);
    }
    if (next <= D.total) e.push(`Дни ${next}–${D.total} не входят ни в один этап`);
    if (next - 1 > D.total) e.push(`Этапы заходят за конец программы (день ${D.total})`);
  }
  if (!ok(D.settings.walk, 1, 250)) e.push("Порог ходьбы — от 1 до 250 шагов в минуту");
  if (!ok(D.settings.high, 60, 250)) e.push("Порог высокого пульса — от 60 до 250 уд/мин");
  if (!ok(D.settings.low, 0, 100000)) e.push("Порог «почти не ходит» — от 0 до 100 000 шагов");
  if (!D.settings.alertUtc) e.push("Укажите время дневных оповещений");
  return e;
}

/* =====================================================================
   Маршрутизация
   ===================================================================== */
function route() {
  hideTip();
  const h = location.hash || "#/";
  const m = h.match(/^#\/patient\/(\d+)/);
  if (m) renderPatient(+m[1]);
  else { stopLive(); pState.pid = null; renderHome(h.includes("alerts")); }
  if (!h.includes("alerts")) window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
updateNavBadge();
route();
</script>
