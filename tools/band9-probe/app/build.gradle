plugins { id 'com.android.application' }
android {
    namespace 'ru.kardiomonitor.band9probe'
    compileSdk 36
    defaultConfig {
        applicationId 'ru.kardiomonitor.band9probe'
        minSdk 26
        targetSdk 36
        versionCode 32
        versionName '0.32'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { debug { debuggable true } }
}
dependencies { implementation project(':protocol') }
